name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Generation Tools
        run: |
          python -m pip install --upgrade pip
          pip install shinylive shiny

      - name: Compile Dashboard to WebAssembly
        run: |
          shinolive_version=$(pip show shinylive | grep Version | awk '{print $2}')
          shinylive export . build_output

      - name: Upload Finished Web Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build_output'

      - name: Deploy Live Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
