name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true # Checks out LFS files if they exist

      - name: Install and Configure Git LFS
        run: |
          git lfs install
          git lfs track "*.csv"
          # Ensure git properties are configured cleanly for the push
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Force Git LFS to process your 50MB file before pushing
          git add .gitattributes
          git push --force https://git:$HF_TOKEN@huggingface.co/spaces/rajan27t/Delhi-Bus-Dashboard HEAD:main
