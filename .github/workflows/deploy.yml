name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [ main ]  # Triggers the build automatically whenever you push to the main branch
  workflow_dispatch:    # Allows you to trigger the build manually from the Actions tab

# Set permissions to allow the action to write assets directly to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent duplicate builds from running concurrently
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Generation Tools
        run: |
          python -m pip install --upgrade pip
          pip install shinylive shiny

      - name: Compile Dashboard to WebAssembly
        run: |
          # Compiles the root files into a standalone static web application
          shinylive export . build_output

      - name: Upload Finished Web Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build_output'

      - name: Deploy Live Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
