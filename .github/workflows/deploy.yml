name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hugging Face CLI
        run: pip install huggingface_hub

      - name: Upload Files to Space via API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # This handles your 50MB file effortlessly using the Hugging Face API chunks
          python -c "
          from huggingface_hub import HfApi
          import os

          api = HfApi(token=os.environ['HF_TOKEN'])
          
          # Upload all app and configuration files to your Space
          files_to_upload = [
              'app.py', 
              'requirements.txt', 
              'ALL_ROUTES_master_summary.csv', 
              'MASTER_SCHEDULE.csv'
          ]
          
          for file in files_to_upload:
              if os.path.exists(file):
                  print(f'Uploading {file} to Hugging Face Space...')
                  api.upload_file(
                      path_or_fileobj=file,
                      path_in_repo=file,
                      repo_id='rajan27t/Delhi-Bus-Dashboard',
                      repo_type='space'
                  )
          print('Deployment completed successfully!')
          "
